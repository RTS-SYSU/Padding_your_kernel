<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101722">
  <title>Padding Your Kernel · GPU 补量工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#analysis">跳到分析结果</a>
  <header class="topbar">
    <div class="wrap top-inner">
      <h1 class="app-title"><a class="brand" href="/">Padding Your Kernel</a></h1>
      <nav class="top-links" aria-label="工作台链接">
        <a class="repo-link" href="https://github.com/RTS-SYSU/Padding_your_kernel" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="workspace">
      <aside class="panel controls" aria-labelledby="inputs-title">
        <h2 id="inputs-title">操作</h2>
        <form id="analysis-form">
          <div class="fields">
            <label for="preset">算子预设</label>
            <select id="preset" disabled><option>正在加载…</option></select>
            <p id="preset-meta" class="quiet field-note"></p>
          </div>
          <button id="analyze" type="submit" class="primary" disabled>分析布局</button>
        </form>
        <p id="input-status" class="input-status" role="status" aria-live="polite"></p>
        <button id="retry-presets" type="button" class="secondary" hidden>重新加载预设</button>
        <div class="live-controls">
          <button id="run-live" type="button" class="secondary" disabled>运行真机实验</button>
          <progress id="live-progress" aria-label="真机实验进行中" hidden></progress>
          <p id="live-status" class="input-status" role="status" aria-live="polite">正在检查本机运行能力…</p>
        </div>
      </aside>

      <div id="analysis" class="analysis" tabindex="-1" aria-label="分析结果" aria-busy="true">
        <h2 class="workspace-title">可视化与结果</h2>
        <section class="panel">
          <div class="panel-head result-head">
            <div><p class="section-label">当前分析</p><h2 id="operator">正在加载</h2><p id="result-meta" class="quiet"></p></div>
            <button id="download" type="button" class="secondary download" disabled>下载 JSON</button>
          </div>
          <div id="result-empty" class="placeholder" role="status">正在加载算子预设…</div>
          <div id="result-body" hidden>
            <div class="metrics">
              <div class="metric"><span>每行建议补量</span><strong id="padding-value">—</strong><small id="result-status"></small></div>
              <div class="metric"><span>逻辑行宽 → 物理行距</span><strong id="pitch-value">—</strong><small id="pitch-note"></small></div>
              <div class="metric"><span>额外分配</span><strong id="bytes-value">—</strong><small id="bytes-note"></small></div>
            </div>
            <div id="layout-section" class="layout-section" hidden>
              <div class="layout-top"><h3>行距对照</h3><label id="operand-label" hidden>操作数 <select id="operand"></select></label><span id="operand-name" class="quiet"></span></div>
              <div id="diagrams" class="diagrams"></div>
              <div class="legend"><span><i class="data-key"></i>逻辑元素</span><span id="pad-legend"><i class="pad-key"></i>行尾补量</span><span id="diagram-note" class="quiet"></span></div>
            </div>
          </div>
        </section>

        <section id="live-result" class="panel" aria-labelledby="live-result-title" hidden>
          <div class="panel-head measurement-head">
            <div><h2 id="live-result-title">本次真机实验</h2><p class="quiet" id="live-result-device"></p></div>
            <span id="live-result-verdict" class="verdict" hidden></span>
          </div>
          <p id="live-result-message" class="measurement-message" role="status"></p>
          <div id="live-result-data" hidden>
            <dl id="live-result-stats" class="native-stats"></dl>
            <div id="live-result-processes" class="native-processes" hidden>
              <h3>各进程配对加速比</h3><ol id="live-result-ratios"></ol>
            </div>
            <p id="live-result-method" class="measurement-method"></p>
          </div>
        </section>

      </div>
    </div>
  </main>
</body>
</html>
