<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14243a">
  <title>Padding Your Kernel</title>
  <link rel="stylesheet" href="/style.css?v=8">
  <script src="/app.js?v=8" defer></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <div class="identity"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Padding Your Kernel</span></div>
    <a href="#results">实验结果 <span aria-hidden="true">↘</span></a>
  </div></header>
  <main class="wrap">
    <div class="intro"><div><h1>GPU 行尾补量分析</h1><p>从访问地址推导补量，比较原布局与补后布局的缓存计数和执行时间。</p></div>
    <button class="refresh" id="history" type="button" aria-pressed="false">历史记录</button></div>
    <div class="workspace">
      <aside class="sidebar" aria-label="实验选择">
        <h2>实验</h2>
        <div class="choices" role="group" aria-label="选择实验">
          <button type="button" data-kind="dual" aria-pressed="true">双窗口基准 <small>重复读取 · L2 驻留</small></button>
          <button type="button" data-kind="pavia" aria-pressed="false">Pavia University <small>最远光谱对 · warp 合并</small></button>
        </div>
        <div class="selects" id="live-controls">
          <label for="launch-case">输入配置</label>
          <select id="launch-case" aria-describedby="case-help" disabled></select>
          <p class="case-help" id="case-help">第一窗口固定读第 0–7 列，选项末尾是第二窗口读取的列范围。</p>
          <button type="button" id="launch" class="launch" disabled>运行实验</button>
        </div>
        <div class="selects" id="selects" hidden>
          <label for="run">实验记录</label><select id="run"></select>
          <label for="case">输入配置</label><select id="case"></select>
        </div>
        <div class="details" id="details"></div>
        <div class="run-status" id="run-status" hidden>
          <progress id="progress" aria-label="实验进行中" hidden></progress>
          <p id="progress-label" role="status"></p>
        </div>
        <p class="status" id="status" role="status"></p>
      </aside>
      <div class="main-column" id="results">
        <section class="panel" id="empty-state" aria-labelledby="empty-title">
          <div class="section-head"><div><h2 id="empty-title">实验结果</h2><p id="empty-message">选择实验和输入配置，运行后查看结果。</p></div></div>
        </section>
        <section class="panel" id="layout-panel" aria-labelledby="layout-title" hidden>
          <div class="section-head"><div><h2 id="layout-title">行距构造</h2></div><span class="phase">事前推导</span></div>
          <div class="tiles" id="tiles"></div>
          <div class="layout" id="phase-layout">
            <div class="layout-head"><h3>行首相位</h3><span id="phase-key"></span></div>
            <div class="layout-body" id="visual" aria-live="polite"></div>
          </div>
          <details id="calculator"><summary>计算其他双窗口行宽</summary>
            <form id="pad-form"><label>逻辑行宽 <input name="width" type="number" min="32" max="4096" step="8" value="104" required></label>
            <label>第二窗口起点 <select name="offset"><option>8</option><option selected>16</option><option>24</option></select></label>
            <button type="submit">计算补量</button><output id="prediction" aria-live="polite"></output></form>
          </details>
        </section>
        <section class="panel" id="measurements" aria-labelledby="measure-title" hidden>
          <div class="section-head"><div><h2 id="measure-title">缓存行为与时间</h2><p id="measure-sub"></p></div><span class="phase measured">硬件采集</span></div>
          <div class="overview" id="overview"></div>
          <div class="table-scroll" id="metric-table" hidden>
            <table><caption class="sr-only">原布局与候选布局的计数对比</caption>
              <thead><tr><th scope="col">指标</th><th scope="col">原布局</th><th scope="col">补后布局</th><th scope="col">变化</th></tr></thead>
              <tbody id="metrics"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
